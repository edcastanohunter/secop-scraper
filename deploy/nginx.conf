# SPA de Angular: rutas desconocidas vuelven a index.html (incluida busquedas/:id, enlazada desde los correos).
# TLS y dominio los pone nginx proxy manager (NPM) delante.
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # index.html nunca en caché: así cada deploy toma los bundles nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Los bundles llevan hash en el nombre: caché larga.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
