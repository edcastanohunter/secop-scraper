<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>SECOP Radar</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Encuentra licitaciones y contratos públicos de Colombia (SECOP I y II) por municipio e industria."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Aplica el tema antes de pintar para evitar el destello claro/oscuro.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('secop-theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
