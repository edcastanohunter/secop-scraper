# Tema de login de SECOP Radar: hereda de keycloak.v2 (PatternFly 5) y solo cambia CSS y
# textos, sin plantillas FreeMarker propias, para que las actualizaciones de Keycloak no lo rompan.
parent=keycloak.v2
import=common/keycloak

# `css/styles.css` sale del tema padre; `secop-radar.css` aplica los tokens de la app.
styles=css/styles.css css/secop-radar.css

# Modo oscuro según `prefers-color-scheme` (añade `.pf-v5-theme-dark` a <html>).
darkMode=true

locales=es
